[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "filesift"
version = "1.0.0"
description = "File integrity monitoring CLI with SHA-256 baselines and honest coverage reporting"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
  "typer>=0.12",
  "rich>=13",
  "pydantic>=2.6",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
filesift = "filesift.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/filesift"]

[tool.pytest.ini_options]
testpaths = ["tests"]
